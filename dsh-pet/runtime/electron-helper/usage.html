<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src file:; connect-src http://127.0.0.1:* http://localhost:*; img-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AI 用量</title>
    <!--
      AI 用量面板「大肥鱼食堂 · 饭票小票」：Shift+左键点大肥鱼弹出（窗口见 main/usage-window.js）。
      数据来自本机插件路由 /usage（地址经 ?api= 传入）；外部文本一律 textContent 写入，不拼 HTML。
      小票高度随内容变化，渲染后经 document.title「usage:<高度>」告诉主进程收紧窗口，不留空白。
      尾巴朝向与高度由主进程按鱼身位置经 window.__usagePlace(side, y) 设置。
    -->
    <style>
      @font-face {
        font-family: 'Ruantang';
        src: url('../../assets/fonts/上首软糖体.ttf') format('truetype');
        font-display: block;
      }
      :root {
        --navy: #24305e;
        --navy2: #2c3f86;
        --ink: #5b6488;
        --mute: #9aa3c2;
        --cream: #fffaf2;
        --lace: #b9c2e4;
        --dot: #cfd6ee;
        --blue: #5a7fd6;
        --rose: #d9604f;
        --amber: #c98a1e;
        --tail-y: 70px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: 'Ruantang', 'Microsoft YaHei UI', sans-serif;
        color: var(--navy);
        -webkit-font-smoothing: antialiased;
      }
      /* 窗口左右各留 14px 给尾巴与阴影，上 8px、下 12px */
      .wrap {
        position: relative;
        margin: 8px 14px 18px;
        filter: drop-shadow(0 4px 8px rgba(20, 28, 60, 0.3));
        animation: pop 0.16s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.98);
        }
      }
      /* 尾巴：指向鱼身 */
      .tail {
        position: absolute;
        top: var(--tail-y);
        width: 0;
        height: 0;
        border: 9px solid transparent;
      }
      .side-left .tail {
        left: -15px;
        border-right: 9px solid var(--cream);
        border-left-width: 6px;
      }
      .side-right .tail {
        right: -15px;
        border-left: 9px solid var(--cream);
        border-right-width: 6px;
      }
      .receipt {
        position: relative;
        background: var(--cream);
        padding: 14px 16px 14px;
        border-radius: 8px 8px 0 0;
        box-shadow: 0 0 0 1px rgba(36, 48, 94, 0.08);
      }
      /* 小票撕口：下沿垂一排奶油色圆齿（不挖孔，背后桌面颜色不影响观感） */
      .receipt::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -7px;
        height: 7px;
        background: radial-gradient(circle at 9px 0, var(--cream) 6.5px, transparent 7px) 0 0 / 18px 7px repeat-x;
      }
      .top {
        position: relative;
        text-align: center;
        -webkit-app-region: drag;
      }
      .logo {
        font-size: 19px;
        line-height: 1.2;
      }
      .logo small {
        display: block;
        font-size: 10.5px;
        color: var(--mute);
        letter-spacing: 2px;
        margin-top: 2px;
      }
      .btn {
        -webkit-app-region: no-drag;
        position: absolute;
        top: -4px;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--mute);
        font:
          15px/22px 'Ruantang',
          sans-serif;
        cursor: pointer;
        padding: 0;
      }
      .btn:hover {
        background: #eef1fa;
        color: var(--navy2);
      }
      .btn.refresh {
        left: -6px;
      }
      .btn.close {
        right: -6px;
      }
      .btn.spin {
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .cut {
        border-top: 2px dashed var(--lace);
        margin: 10px -4px 8px;
      }
      .sec {
        font-size: 10.5px;
        color: var(--blue);
        letter-spacing: 3px;
        margin: 8px 0 2px;
      }
      .ln {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 13.5px;
        line-height: 1.35;
        padding: 3px 0 0;
      }
      .ln .dots {
        flex: 1;
        min-width: 12px;
        border-bottom: 2px dotted var(--dot);
        transform: translateY(-4px);
      }
      .ln b {
        font-weight: 400;
        color: var(--navy2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ln b.low {
        color: var(--amber);
      }
      .ln b.out {
        color: var(--rose);
      }
      .ln b.stale {
        color: var(--mute);
        text-decoration: line-through dotted;
      }
      .ln.click {
        cursor: pointer;
      }
      .ln.click:hover > span:first-child {
        color: var(--blue);
      }
      .ln .chev {
        font-size: 10px;
        color: var(--mute);
      }
      .note {
        font-size: 10.5px;
        color: var(--mute);
        text-align: right;
        line-height: 1.35;
        margin-top: 1px;
      }
      .note.warn {
        color: var(--rose);
        text-align: left;
        user-select: text;
      }
      .stamp {
        position: absolute;
        right: 30px;
        top: -5px;
        transform: rotate(-12deg);
        border: 2px solid var(--rose);
        color: var(--rose);
        border-radius: 7px;
        padding: 0 6px;
        font-size: 13px;
        line-height: 1.35;
        opacity: 0.85;
        pointer-events: none;
        background: rgba(255, 250, 242, 0.7);
      }
      .keys {
        margin: 3px 0 2px 10px;
      }
      .key {
        display: flex;
        align-items: baseline;
        gap: 5px;
        font-size: 11.5px;
        color: var(--ink);
        padding-top: 2px;
      }
      .key .kn {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 150px;
      }
      .key .dots {
        flex: 1;
        min-width: 8px;
        border-bottom: 1.5px dotted #dfe3f2;
        transform: translateY(-3px);
      }
      .key.kd {
        font-size: 10px;
        color: var(--mute);
        padding: 0 0 1px 2px;
      }
      .tot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 15px;
      }
      .tot b {
        font-weight: 400;
        color: var(--rose);
        font-variant-numeric: tabular-nums;
      }
      .foot {
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--mute);
      }
      .wait {
        color: var(--mute);
        animation: blink 1s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap side-left" id="wrap">
      <span class="tail"></span>
      <div class="receipt" role="dialog" aria-label="AI 用量">
        <div class="top">
          <button class="btn refresh" id="refresh" type="button" title="立即刷新" aria-label="立即刷新">↻</button>
          <div class="logo">大肥鱼食堂<small id="sub">AI 饭票小票</small></div>
          <button class="btn close" id="close" type="button" title="收起（Esc）" aria-label="收起">×</button>
        </div>
        <div class="cut"></div>
        <div id="body"></div>
        <div class="cut"></div>
        <div class="tot"><span>本期吃掉</span><b id="total">…</b></div>
        <div class="foot"><span>Shift + 点鱼 收起</span><span id="time"></span></div>
      </div>
    </div>

    <script>
      'use strict';
      const API = new URLSearchParams(location.search).get('api') || '';
      const TZ = 'America/New_York';
      const $ = (id) => document.getElementById(id);
      const fmtDate = new Intl.DateTimeFormat('zh-CN', {
        timeZone: TZ,
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });
      const fmtDay = new Intl.DateTimeFormat('zh-CN', { timeZone: TZ, month: 'numeric', day: 'numeric' });
      const fmtTime = new Intl.DateTimeFormat('zh-CN', {
        timeZone: TZ,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });

      /** 建元素：只用 textContent 写文本。 */
      function h(tag, cls, ...kids) {
        const el = document.createElement(tag);
        if (cls) el.className = cls;
        for (const k of kids.flat())
          if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k));
        return el;
      }
      const usd = (n) => '$' + (Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('en-US') : n.toFixed(2));
      const usdSmall = (n) => (n === 0 ? '$0' : n < 0.01 ? '<$0.01' : usd(n));
      const pct = (n) => Math.round(n * 10) / 10 + '%';
      const compact = (n) =>
        n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n));
      const level = (p) => (p <= 0.5 ? 'out' : p <= 20 ? 'low' : '');
      function until(ms) {
        const min = Math.round((ms - Date.now()) / 60000);
        if (min <= 0) return '马上补货';
        const d = Math.floor(min / 1440),
          hr = Math.floor((min % 1440) / 60);
        return d ? `${d} 天 ${hr} 小时后补货` : hr ? `${hr} 小时后补货` : `${min} 分钟后补货`;
      }
      function ago(ms) {
        const s = Math.round((Date.now() - ms) / 1000);
        return s < 45 ? '刚刚' : s < 3600 ? `${Math.round(s / 60)} 分钟前` : `${Math.round(s / 3600)} 小时前`;
      }

      /** 一行：名字 …… 数值。value 为 null 时显示读取中。 */
      function line(name, value, cls, extra) {
        const ln = h(
          'div',
          'ln',
          h('span', null, name),
          h('span', 'dots'),
          value === null ? h('b', 'wait', '…') : h('b', cls || '', value),
        );
        if (extra) ln.append(extra);
        return ln;
      }
      /** 来源出错：有旧数据说明数据时间，没有就直接给原因。 */
      function warn(src, extra) {
        const parts = [];
        if (src.error) parts.push(src.data ? `${src.error}（显示${ago(src.okAt)}的）` : src.error);
        if (extra) parts.push(extra);
        return parts.length ? h('div', 'note warn', parts.join(' · ')) : null;
      }

      function planBlock(name, src) {
        const d = src.data;
        if (!d) return [line(name + ' 周', src.error ? '—' : null, 'out'), warn(src)];
        const w = d.weekly || d.fiveHour;
        const label = d.weekly ? ' 周' : ' 5h';
        const stamp = w.remainingPercent <= 0.5 ? h('span', 'stamp', '吃光啦') : null;
        const stale = Boolean(d.liveError);
        const out = [
          line(
            name + label,
            pct(w.remainingPercent),
            stale ? 'stale' : level(w.remainingPercent),
            stale ? null : stamp,
          ),
        ];
        const notes = [];
        if (w.resetsAt) notes.push(`${fmtDate.format(new Date(w.resetsAt * 1000))} · ${until(w.resetsAt * 1000)}`);
        if (d.weekly && d.fiveHour) notes.push(`5h 剩 ${pct(d.fiveHour.remainingPercent)}`);
        if (notes.length) out.push(h('div', 'note', notes.join(' · ')));
        out.push(warn(src, stale ? `实时没读到：${d.liveError} 上面是${ago(d.updatedAt)}的旧数据` : null));
        return out;
      }

      const open = {};
      function keyList(keys) {
        const used = keys.filter((k) => k.costUsd > 0 || k.requests > 0).sort((a, b) => b.costUsd - a.costUsd);
        const box = h('div', 'keys');
        for (const k of used) {
          box.append(h('div', 'key', h('span', 'kn', k.name), h('span', 'dots'), h('span', null, usdSmall(k.costUsd))));
          box.append(h('div', 'key kd', `${k.requests.toLocaleString('en-US')} 次 · ${compact(k.tokens)} tokens`));
        }
        const idle = keys.length - used.length;
        if (!used.length) box.append(h('div', 'key kd', '本期还没人动筷'));
        if (idle) box.append(h('div', 'key kd', `另有 ${idle} 个 Key 没动筷`));
        return box;
      }
      function cardBlock(id, name, src) {
        const d = src.data;
        if (!d) return [line(name, src.error ? '—' : null, 'out'), warn(src)];
        const has = typeof d.grantUsd === 'number' && d.grantUsd > 0 && typeof d.remainingUsd === 'number';
        const p = has ? (d.remainingUsd / d.grantUsd) * 100 : 100;
        const ln = line(name, has ? usd(d.remainingUsd) : usd(d.totalCostUsd), level(p));
        const chev = h('span', 'chev', open[id] ? ' ▾' : ' ▸');
        ln.firstChild.append(chev);
        ln.classList.add('click');
        ln.title = '点开看每个 Key';
        const keys = keyList(d.keys || []);
        keys.hidden = !open[id];
        ln.addEventListener('click', () => {
          open[id] = !open[id];
          keys.hidden = !open[id];
          chev.textContent = open[id] ? ' ▾' : ' ▸';
          report();
        });
        const notes = [];
        if (has) notes.push(`共 ${usd(d.grantUsd)}`);
        if (d.nextResetAt)
          notes.push(
            d.expiringUsd
              ? `${fmtDay.format(new Date(d.nextResetAt))} 先过期 ${usd(d.expiringUsd)}`
              : `${fmtDay.format(new Date(d.nextResetAt))} 到期`,
          );
        const extra = d.creditError
          ? `赠送额度没刷新：${d.creditError}`
          : d.creditSource === 'config'
            ? '赠送额度是估算'
            : null;
        return [ln, notes.length ? h('div', 'note', notes.join(' · ')) : null, keys, warn(src, extra)];
      }
      function deepseekBlock(src) {
        const d = src.data;
        if (!d) return [line('DeepSeek', src.error ? '—' : null, 'out'), warn(src)];
        const b = d.balances.find((x) => x.currency === 'USD') || d.balances[0];
        const sym = b.currency === 'CNY' ? '¥' : '$';
        return [
          line('DeepSeek', sym + b.total.toFixed(2), b.total < 5 ? 'out' : b.total < 20 ? 'low' : ''),
          h('div', 'note', `充值 ${sym}${b.toppedUp.toFixed(2)} · 赠送 ${sym}${b.granted.toFixed(2)}`),
          warn(src),
        ];
      }

      /** 账户余额与 Key 限额独立展示，不混入其他平台的本期花费。 */
      function openrouterBlock(src) {
        if (!src) return [];
        const d = src.data;
        if (!d) return [line('OpenRouter · Jev', src.error ? '—' : null, 'out'), warn(src)];
        const cycles = { daily: '每日（UTC）', weekly: '每周（UTC）', monthly: '每月（UTC）' };
        const period = d.limitReset === null ? '不重置' : cycles[d.limitReset];
        const exactUsd = (n) => '$' + n.toLocaleString('en-US', { useGrouping: false, maximumSignificantDigits: 21 });
        return [
          line('OpenRouter · Jev', d.account ? exactUsd(d.account.balanceUsd) : '—'),
          h('div', 'note', d.account ? `账户余额 · 总充值 ${exactUsd(d.account.totalCreditsUsd)}` : '账户余额未知'),
          line(
            'Key 剩余 / 上限',
            d.limitUsd === null ? '无限额' : `${exactUsd(d.remainingUsd)} / ${exactUsd(d.limitUsd)}`,
          ),
          h('div', 'note', `限额${period} · Key 累计已用 ${exactUsd(d.usageUsd)}`),
          h(
            'div',
            'note',
            `UTC 日 ${exactUsd(d.dailyUsageUsd)} · 周 ${exactUsd(d.weeklyUsageUsd)} · 月 ${exactUsd(d.monthlyUsageUsd)}`,
          ),
          warn(src, d.accountError ? `账户额度未读到：${d.accountError}` : null),
        ];
      }

      let snap = null;
      let visible = true;
      let timer = 0;
      let inflight = false;
      let lastH = 0;

      /** 把小票实际高度告诉主进程，窗口按它收紧。 */
      function report() {
        requestAnimationFrame(() => {
          const need = Math.ceil($('wrap').getBoundingClientRect().bottom + 18);
          if (need !== lastH) {
            lastH = need;
            document.title = 'usage:' + need;
          }
        });
      }

      function render() {
        const s = snap;
        const rows = [
          h('div', 'sec', '· 订阅 ·'),
          ...planBlock('Codex', s.codex),
          ...planBlock('Claude', s.claude),
          h('div', 'sec', '· 饭卡 ·'),
          ...cardBlock('codexApi', 'Codex API', s.codexApi),
          ...cardBlock('claudeApi', 'Claude API', s.claudeApi),
          ...deepseekBlock(s.deepseek),
          ...openrouterBlock(s.openrouter),
        ];
        $('body').replaceChildren(...rows.filter(Boolean));
        const spent = [s.codexApi.data, s.claudeApi.data].filter(Boolean).reduce((t, d) => t + d.totalCostUsd, 0);
        $('total').textContent = s.codexApi.data || s.claudeApi.data ? usd(spent) : '…';
        const busy = ['codex', 'claude', 'codexApi', 'claudeApi', 'deepseek', 'openrouter'].some(
          (k) => s[k]?.refreshing,
        );
        $('sub').textContent = busy ? 'AI 饭票小票 · 正在对账…' : 'AI 饭票小票';
        $('time').textContent = s.generatedAt ? '纽约 ' + fmtTime.format(new Date(s.generatedAt)) : '';
        report();
        return busy;
      }

      async function load(force) {
        if (inflight || !API) return;
        inflight = true;
        clearTimeout(timer);
        $('refresh').classList.add('spin');
        let again = 60000;
        try {
          const res = await fetch(API + (force ? '?refresh=1' : ''), {
            cache: 'no-store',
            signal: AbortSignal.timeout(20000),
          });
          const body = await res.json();
          if (!res.ok || body.ok === false) throw new Error(body.message || `HTTP ${res.status}`);
          snap = body;
          if (render()) again = 3000;
        } catch {
          $('sub').textContent = 'AI 饭票小票 · 本机服务暂不可用';
          again = 15000;
        } finally {
          inflight = false;
          $('refresh').classList.remove('spin');
          if (visible) timer = setTimeout(() => load(false), again);
        }
      }

      // 主进程调用：显示 / 隐藏 / 摆放
      window.__usageShown = () => {
        visible = true;
        load(false);
      };
      window.__usageHidden = () => {
        visible = false;
        clearTimeout(timer);
      };
      window.__usagePlace = (side, tailY) => {
        $('wrap').className = 'wrap side-' + (side === 'right' ? 'right' : 'left');
        // tailY 是窗口内的 CSS 纵坐标（鱼身瞄准点），换成 .wrap 内尾巴顶端
        $('wrap').style.setProperty('--tail-y', Math.max(14, Math.round(tailY - 8 - 9)) + 'px');
      };
      $('refresh').addEventListener('click', () => load(true));
      $('close').addEventListener('click', () => window.close());
      const empty = { data: null, error: null, refreshing: true, okAt: null };
      snap = {
        codex: empty,
        claude: empty,
        codexApi: empty,
        claudeApi: empty,
        deepseek: empty,
        openrouter: empty,
        generatedAt: 0,
      };
      render();
      document.fonts.ready.then(report);
      load(false);
    </script>
  </body>
</html>

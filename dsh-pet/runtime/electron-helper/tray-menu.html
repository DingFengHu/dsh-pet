<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>tray-menu</title>
    <!--
      托盘右键菜单（Windows）：Electron 自带菜单按强制的设备缩放 1 绘制，在高 DPI 屏上字太小，
      所以改由这个页面绘制，主进程按宠物缩放设 zoomFactor。尺寸常量与 main/tray-menu-window.js 一致。
      菜单项经 URL 参数 items 传入；点击经 document.title「tray-menu:pick:<序号>」上报（页面无 Node 能力）。
    -->
    <style>
      :root {
        --bg: #fbfbfb;
        --fg: #1b1b1b;
        --hover: #e8eef9;
        --line: #e3e3e3;
        --border: #d6d6d6;
        --accent: #2f6fdb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2b2b;
          --fg: #f2f2f2;
          --hover: #3d4656;
          --line: #444;
          --border: #4a4a4a;
          --accent: #8ab4ff;
        }
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
        font-size: 14px;
        color: var(--fg);
      }
      .menu {
        box-sizing: border-box;
        margin: 6px;
        padding: 4px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }
      .item {
        display: flex;
        align-items: center;
        height: 32px;
        padding: 0 14px 0 6px;
        border-radius: 5px;
        cursor: default;
        white-space: nowrap;
        overflow: hidden;
      }
      .item > span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item:hover,
      .item.active {
        background: var(--hover);
      }
      .check {
        width: 22px;
        flex: none;
        text-align: center;
        color: var(--accent);
        font-weight: 600;
      }
      .sep {
        height: 1px;
        margin: 4px 6px;
        background: var(--line);
      }
    </style>
  </head>
  <body>
    <div class="menu" id="menu" role="menu"></div>
    <script>
      (function () {
        var items = [];
        try {
          items = JSON.parse(new URLSearchParams(location.search).get('items') || '[]');
        } catch (e) {
          items = [];
        }
        var menu = document.getElementById('menu');
        var rows = [];
        items.forEach(function (item, i) {
          if (item.separator) {
            var sep = document.createElement('div');
            sep.className = 'sep';
            menu.appendChild(sep);
            return;
          }
          var row = document.createElement('div');
          row.className = 'item';
          row.setAttribute('role', item.checkbox ? 'menuitemcheckbox' : 'menuitem');
          var check = document.createElement('span');
          check.className = 'check';
          check.textContent = item.checked ? '✓' : '';
          var label = document.createElement('span');
          label.textContent = String(item.label || '');
          row.appendChild(check);
          row.appendChild(label);
          row.addEventListener('click', function () {
            document.title = 'tray-menu:pick:' + i;
          });
          row.dataset.index = String(i);
          menu.appendChild(row);
          rows.push(row);
        });
        // 键盘：上下选择、回车确认（Esc 由主进程拦截收起）
        var active = -1;
        function setActive(n) {
          if (!rows.length) return;
          active = (n + rows.length) % rows.length;
          rows.forEach(function (r, k) {
            r.classList.toggle('active', k === active);
          });
        }
        document.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') setActive(active + 1);
          else if (e.key === 'ArrowUp') setActive(active - 1);
          else if (e.key === 'Enter' && active >= 0) document.title = 'tray-menu:pick:' + rows[active].dataset.index;
        });
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
        });
      })();
    </script>
  </body>
</html>
